listen_addresses = '*'

# 呼出回数・累積実行時間を計測する。ライブラリの有効化には再起動が必要。
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on

# 遅い問い合わせとロック待ちだけログへ。画像の bind 値は出力しない。
log_min_duration_statement = '100ms'
log_lock_waits = on
log_parameter_max_length = 0

# 正常な再起動では WAL は書き出される。クラッシュ時のみ直近のコミットを失う。
synchronous_commit = off

jit = off
max_wal_size = 4GB
checkpoint_timeout = 15min
