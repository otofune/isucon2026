user www-data;
worker_processes auto;
pid /run/nginx.pid;
worker_rlimit_nofile 200000;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 65535;
	multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	# alp 用。署名付き URL のクエリ文字列や認証情報は記録しない。
	log_format isureal_profile escape=json
		'{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
		'"status":$status,"body_bytes":$body_bytes_sent,"request_time":$request_time,'
		'"upstream_time":"$upstream_response_time","upstream_connect":"$upstream_connect_time",'
		'"upstream_header":"$upstream_header_time"}';
	access_log off;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


