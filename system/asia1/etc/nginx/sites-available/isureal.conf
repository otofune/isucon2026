upstream isureal_app {
  server 127.0.0.1:8080;
  keepalive 512;
}

# 読み取りだけの API は DB 台のアプリにも分散する。画像の書き込みと SSE は asia1 に残す。
upstream isureal_read {
  least_conn;
  server 127.0.0.1:8080 weight=2;
  server 192.168.4.10:8080;
  keepalive 256;
}

map "$request_method:$uri" $isureal_upstream {
  default isureal_app;
  "~^GET:/api/(feeds/|memories|users(/|$)|relationships/|posts/[0-9a-f-]{36}(/comments|/realmojis)?$)" isureal_read;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  # 投稿画像をディスクの一時ファイルに書かない。
  client_body_buffer_size 2m;
  root /home/isucon/webapp/public;

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://$isureal_upstream;
  }

  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://isureal_app;
  }

  location / {
    try_files $uri /index.html;
  }
}
